---
layout: default
title: Jewels of knowledge
description: Reflections and notes on knowledge, the mind, and the self.
---
<div class="blog-container">
  <h3>{{ page.title }}</h3>
  <p>Reflections and notes written along the way:</p>

  <ul class="blog-post-list">
    {% for post in site.posts %}
    <li class="blog-post-card">
      <a href="{{ post.url }}" title="{{ post.title }}">
        <span class="blog-post-title">{{ post.title }}</span>
        <span class="blog-post-date">{{ post.date | date_to_string }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
